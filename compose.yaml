services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yusuf_sugiyarto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - yusuf_sugiyarto_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yusuf_sugiyarto"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yusuf_sugiyarto_postgres:
