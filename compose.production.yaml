# Deployment template for a single host behind an HTTPS reverse proxy.
# Copy .env.production.example to a secure location outside version control,
# fill it, then pass it with: docker compose --env-file <path> -f compose.production.yaml up -d --build
services:
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      RATE_LIMIT_SALT: ${RATE_LIMIT_SALT:?RATE_LIMIT_SALT must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        BACKEND_URL: http://backend:4000
    environment:
      BACKEND_URL: http://backend:4000
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
