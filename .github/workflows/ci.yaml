name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:4000

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yusuf_sugiyarto_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yusuf_sugiyarto_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yusuf_sugiyarto_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema and migration metadata
        run: npx prisma validate --schema backend/prisma/schema.prisma
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Confirm migration state
        run: npx prisma migrate status --schema backend/prisma/schema.prisma

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend runtime and migration images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build backend migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: migration
          push: false
          cache-from: type=gha,scope=backend-migration
          cache-to: type=gha,mode=max,scope=backend-migration
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          push: false
          build-args: BACKEND_URL=http://backend:4000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
